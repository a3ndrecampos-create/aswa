name: Gerar Keystore (rodar uma vez só)

# Só roda quando você aciona manualmente (aba Actions → este workflow → "Run workflow").
# É pra rodar UMA VEZ SÓ na vida do projeto — depois de gerar, você guarda a keystore em
# lugar seguro (fora do repositório) e configura os 4 secrets abaixo. Rodar de novo cria
# uma keystore DIFERENTE, e trocar de keystore depois de publicar o app quebra as
# atualizações (o Google Play exige a mesma assinatura pra sempre naquele app).
on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Nome (alias) da chave dentro da keystore'
        required: true
        default: 'flexotimizador'
      store_password:
        description: 'Senha da keystore (ANOTE — vai precisar dela nos secrets)'
        required: true
      key_password:
        description: 'Senha da chave (pode repetir a mesma senha acima)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar a keystore
        env:
          KEY_ALIAS: ${{ github.event.inputs.key_alias }}
          STORE_PASSWORD: ${{ github.event.inputs.store_password }}
          KEY_PASSWORD: ${{ github.event.inputs.key_password }}
        run: |
          keytool -genkeypair -v \
            -keystore release-keystore.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity 10950 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Flex Otimizador de Rota, OU=App, O=Flex, L=Sao Paulo, ST=SP, C=BR"

      - name: Conferir que a senha realmente abre a keystore (detecta problema na hora)
        env:
          STORE_PASSWORD: ${{ github.event.inputs.store_password }}
        run: |
          keytool -list -keystore release-keystore.jks -storepass "$STORE_PASSWORD" > /dev/null
          echo "✅ Senha confere — a keystore abre normalmente com o que foi digitado."

      - name: Gerar versão em base64 (pra colar no secret ANDROID_KEYSTORE_BASE64)
        run: base64 -w 0 release-keystore.jks > release-keystore.base64.txt

      - name: Disponibilizar pra download
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-NAO-COMPARTILHE
          path: |
            release-keystore.jks
            release-keystore.base64.txt
          retention-days: 7
