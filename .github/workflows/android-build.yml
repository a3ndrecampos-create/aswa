name: Android Build
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APKs (production + closedTesting)
        run: gradle assembleDebug --no-daemon
      - name: Upload APK - production
        uses: actions/upload-artifact@v4
        with:
          name: app-production-debug
          path: app/build/outputs/apk/production/debug/app-production-debug.apk
      - name: Upload APK - closedTesting
        uses: actions/upload-artifact@v4
        with:
          name: app-closedTesting-debug
          path: app/build/outputs/apk/closedTesting/debug/app-closedTesting-debug.apk
